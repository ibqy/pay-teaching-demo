server:
  port: 8080
spring:
  application:
    name: pay-teaching-demo
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  datasource:
    url: jdbc:h2:mem:paydb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

pay:
  alipay:
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    app-id: 2021000000000000
    app-private-key: "请替换为应用私钥"
    alipay-public-key: "请替换为支付宝公钥"
    sign-type: RSA2
    notify-url: http://your-domain/api/notify/alipay
    return-url: http://your-domain/api/return
  wechat:
    mch-id: "请替换为商户号"
    api-v-3-key: "请替换为APIv3密钥"
    private-key: "请替换为商户私钥"
    merchant-serial-no: "请替换为证书序列号"
    app-id: "请替换为AppId"
    notify-url: http://your-domain/api/notify/wechat
